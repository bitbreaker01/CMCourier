# SQL Server 2022 local para probar la fuente de metadata `mssql` (plan B,
# registro de conexiones con alias). Es el mismo rol que cumple
# alfresco-compose.yml para CMIS: un destino REAL contra el cual validar
# el adapter, no sólo mocks.
#
# Usage:
#   docker compose -f mssql-compose.yml up -d
#   ./mssql-seed.sh            # crea la DB `cmcourier` + dbo.clientes desde sample/clients.csv
#
# Requisitos del lado CLIENTE (host): pyodbc + "ODBC Driver 18 for SQL Server"
# (msodbcsql18). Ver docs/how-to/probar-la-consola.md → "SQL Server local".
#
# Bind explícito a 127.0.0.1 (misma razón que alfresco-compose.local.yml:
# no exponer el puerto a la red ni chocar con otros binds de 0.0.0.0).
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cmcourier-staging-mssql
    environment:
      ACCEPT_EULA: "Y"
      # Sólo para el banco local. SQL Server exige mayúscula+minúscula+dígito+símbolo.
      MSSQL_SA_PASSWORD: "CmCourier!2026"
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mssql-data:
