# =============================================================================
# CMCourier — REFERENCE CONFIG (every configurable option, annotated)
# =============================================================================
#
# This file documents the COMPLETE configurable surface of CMCourier as of
# version 0.113.1. It is a *reference*, not a runnable config:
#
#   * Every path below is a PLACEHOLDER (`/path/to/...`). The schema uses
#     pydantic FilePath / DirectoryPath for inputs that MUST already exist,
#     so this file will NOT load as-is — copy it, then point the paths at
#     your real files.
#   * Several blocks are discriminated unions: only ONE variant may be
#     active at a time (e.g. `trigger.kind`, `indexing.source.kind`,
#     `mapping` consolidated-vs-split). The alternatives are shown as
#     commented `# ---- OR ----` blocks.
#   * Each field is annotated with its default and constraints. Fields
#     marked (REQUIRED) have no default — omitting them is a load error.
#   * Unknown keys are REJECTED (`extra="forbid"`) — a typo'd key fails
#     fast at load time rather than being silently ignored.
#
# CREDENTIALS NEVER LIVE HERE. They are read from environment variables,
# one pair per connection ALIAS, upper-cased: <ALIAS>_USERNAME / <ALIAS>_PASSWORD.
#   * CMIS_USERNAME / CMIS_PASSWORD   — always required (alias `cmis`)
#   * AS400_USERNAME / AS400_PASSWORD — implicit alias `as400` of every connection
#                                       written INLINE (indexing.source.connection,
#                                       metadata.sources[].as400_connection,
#                                       tracking.as400_sync.connection)
#   * RVI_USERNAME / RVI_PASSWORD     — a `connections.rvi` entry (see below)
#
# Source of truth: src/cmcourier/config/schema.py
# =============================================================================


# -----------------------------------------------------------------------------
# connections  (default: {})  — 129: registry of named connections.
# Key = alias, matching ^[a-z][a-z0-9_]{0,31}$ (`cmis` is reserved).
# Any site that takes an inline connection object also accepts a `str` alias
# from this registry; the loader checks the alias exists and its `kind`
# matches what the site expects (an as400 source cannot point to mssql).
# Credentials: <ALIAS>_USERNAME / <ALIAS>_PASSWORD.
# Console (`cmcourier console`): this registry can be managed entirely from
# `[2] CREDENCIALES` — add / edit / remove an alias, or move an inline as400
# connection into it — without hand-editing this file (138).
# Connection test (`doctor` / "probar conexión"), 143: after the login the
# doctor runs ONE cheap query. Order: `probe_query` if set → derived from
# the site that uses the alias (indexing query, metadata table/query,
# tracking.as400_sync library.table) → ping only when the alias has no site
# yet. There is NO fixed pseudo-table (SYSIBM.SYSDUMMY1) any more: on an
# iSeries behind SafeNet/i only whitelisted objects are readable per profile.
# -----------------------------------------------------------------------------
connections:
  rvi:                                     # → RVI_USERNAME / RVI_PASSWORD
    kind: as400
    host: as400.bank.example               # (REQUIRED)
    port: 446                              # (default: 446)  range 1..65535
    database: RVILIB                       # (default: "RVILIB")
    driver: "iSeries Access ODBC Driver"   # (default: "iSeries Access ODBC Driver")
    table: null                            # (default: null) optional bare-table hint
    probe_query: null                      # (default: null) 143: SQL for the connection
                                           #   test, e.g. "SELECT 1 FROM RVILIB.RVABREP
                                           #   FETCH FIRST 1 ROW ONLY"; null → derived
  clientes_sql:                            # → CLIENTES_SQL_USERNAME / CLIENTES_SQL_PASSWORD
    kind: mssql                            # 130: SQL Server via ODBC
    host: 127.0.0.1                        # (REQUIRED)
    port: 1433                             # (default: 1433)
    database: cmcourier                    # (REQUIRED)
    driver: "ODBC Driver 18 for SQL Server"  # (default) msodbcsql18
    encrypt: true                          # (default: true)  Encrypt=yes
    trust_server_certificate: false        # (default: false) yes → accept self-signed certs
    probe_query: null                      # (default: null) 143: e.g. "SELECT TOP 1 1 FROM
                                           #   dbo.clientes"; null → derived from the site


# -----------------------------------------------------------------------------
# trigger  (REQUIRED)  — S0: how documents to migrate are discovered.
# Discriminated union on `kind`: csv | rvabrep | local_scan | single_doc.
# NOTE: `kind: as400` was REMOVED in 0.51.0 — AS400 is now a *source* choice
#       on `indexing.source`, not a trigger kind.
# -----------------------------------------------------------------------------
trigger:
  # --- kind: csv --- (the only kind where `kind:` may be omitted; the loader
  # injects `kind: csv` for backward compatibility with pre-0.14 configs.)
  kind: csv
  csv_path: /path/to/triggers.csv          # (REQUIRED) CSV listing the docs to migrate
  shortname_column: ShortName              # (default: "ShortName")
  cif_column: CIF                          # (default: "CIF")
  system_id_column: SystemID               # (default: "SystemID")

  # ---- OR ---- kind: rvabrep — scan the RVABREP table directly (no CSV).
  #   The RVABREP table comes from `indexing.source` below (CSV or AS400).
  # kind: rvabrep
  # filters:                               # (default: empty → scan everything)
  #   systems: ["1", "3"]                  # (default: []) keep only these system ids
  #   document_types: ["CC03", "FF17"]     # (default: []) MIGRATE only these RVI doc
  #                                        #   types. 148: the rest still comes back
  #                                        #   from the source and is reported as
  #                                        #   EXCLUDED_BY_FILTER in the batch census.

  # ---- OR ---- kind: local_scan — files already extracted to a local dir.
  #   Each file in `scan_path` is cross-referenced against RVABREP by name.
  # kind: local_scan
  # scan_path: /path/to/local-scan-pool    # (REQUIRED) directory; must exist
  # recursive: false                       # (default: false; 088) true → descend
  #                                        #   into every subdirectory of scan_path

  # ---- OR ---- kind: single_doc — one-shot diagnostic pipeline.
  #   No extra fields: the trigger (shortname / cif / system_id) is passed
  #   as CLI args at run time, not here.
  # kind: single_doc


# -----------------------------------------------------------------------------
# indexing  (REQUIRED)  — S1: the RVABREP master table + how to read it.
# `source` is a discriminated union on `kind`: csv | as400.
# This one source feeds BOTH S0 (rvabrep-direct trigger) and S1 (enrichment).
# -----------------------------------------------------------------------------
indexing:
  source:
    # --- kind: csv --- RVABREP simulated as a CSV file (testing / staging /
    # small banks that export RVABREP to a file).
    kind: csv
    csv_path: /path/to/rvabrep.csv         # (REQUIRED) the RVABREP-shaped CSV

    # ---- OR ---- kind: as400 — the live RVABREP table on DB2/AS400, reached
    # by an operator-defined SELECT. The query MAY carry JOINs / WHERE
    # filters, but its OUTPUT COLUMNS must be RVABREP-shaped (the `columns`
    # map below is applied to the result set exactly as to a CSV).
    # kind: as400
    # connection: rvi                      # alias from `connections:` (129) …
    # connection:                          # … OR an inline object (implicit alias `as400`)
    #   host: as400.bank.example           # (REQUIRED) AS400 host / system name
    #   port: 446                          # (default: 446)  range 1..65535
    #   database: RVILIB                   # (default: "RVILIB")
    #   driver: "iSeries Access ODBC Driver"  # (default: "iSeries Access ODBC Driver")
    #   table: null                        # (default: null) optional bare-table hint
    # query: "SELECT * FROM RVILIB.RVABREP" # (REQUIRED) SELECT returning RVABREP shape

  # columns — logical → physical column map for the RVABREP source.
  # Defaults are the canonical AS400 field names. Override per environment.
  columns:                                 # (default: all canonical names below)
    shortname_column: ABABCD               # (default: "ABABCD")
    system_id_column: ABAACD               # (default: "ABAACD")
    delete_code_column: ABACST             # (default: "ABACST")
    txn_num_column: ABAANB                 # (default: "ABAANB")
    index2_column: ABACCD                  # (default: "ABACCD")
    index3_column: ABADCD                  # (default: "ABADCD")
    index4_column: ABAECD                  # (default: "ABAECD")
    index5_column: ABAFCD                  # (default: "ABAFCD")
    index6_column: ABAGCD                  # (default: "ABAGCD")
    index7_column: ABAHCD                  # (default: "ABAHCD")
    image_type_column: ABABST              # (default: "ABABST")
    image_path_column: ABAICD              # (default: "ABAICD")
    file_name_column: ABAJCD               # (default: "ABAJCD")
    creation_date_column: ABAADT           # (default: "ABAADT")
    last_view_date_column: ABABDT          # (default: "ABABDT")
    total_pages_column: ABABUN             # (default: "ABABUN")

  # batch_size — DEAD KNOB since 121. It used to size the batched RVABREP
  # lookup, which was removed; nothing reads it any more. Still ACCEPTED so
  # existing YAMLs keep loading under `extra="forbid"`. NOT the same as the
  # top-level `batch_size` (see end of file), which is very much alive.
  batch_size: 50                           # (default: 50)  >= 1  — no effect (121)


# -----------------------------------------------------------------------------
# mapping  (REQUIRED)  — S2: the "Modelo Documental" (RVI → CM class map).
# THREE mutually-exclusive modes — provide EXACTLY ONE:
#   * consolidated: a single `csv_path` with all columns inline (legacy / fixtures).
#   * split:        `rvi_cm_csv_path` + `metadatos_csv_path` (035 — DEPRECATED by 145).
#   * manifest:     `rvi_cm_csv_path` + `type_manifest_path` (145 — RECOMMENDED for
#                   new installs). See docs/how-to/cm-type-manifest.md.
# -----------------------------------------------------------------------------
mapping:
  # --- consolidated mode --- one CSV, comma-separated METADATOS cell.
  csv_path: /path/to/modelo_documental.csv # one of: consolidated XOR split XOR manifest

  # ---- OR ---- split mode (035 / production bank format, DEPRECATED by 145)
  # — two CSVs joined by IDCM ↔ IDCorto. Set BOTH and leave `csv_path` /
  # `type_manifest_path` unset.
  # rvi_cm_csv_path: /path/to/MapeoRVI_CM.csv      # one row per IDRVI
  # metadatos_csv_path: /path/to/MetadatosCM.csv   # multiple rows per IDCorto

  # ---- OR ---- manifest mode (145, RECOMMENDED) — MapeoRVI_CM.csv reduced to
  # IDSistema,IDRVI,IDCM + a JSON manifest downloaded with `cmcourier types
  # discover`. Nothing about the CM type (CMIS type, folder, properties) is
  # hand-maintained anymore. Set BOTH and leave `csv_path` / `metadatos_csv_path`
  # unset.
  # rvi_cm_csv_path: /path/to/MapeoRVI_CM.csv          # IDSistema,IDRVI,IDCM
  # type_manifest_path: /path/to/cm-type-manifest.json # `cmcourier types discover` output

  # --- column names: consolidated-mode CSV ---
  id_rvi_column: "ID RVI"                          # (default: "ID RVI")
  clase_id_column: "ID CLASE DOCUMENTAL"           # (default: "ID CLASE DOCUMENTAL")
  id_corto_column: "ID Corto"                      # (default: "ID Corto")
  clase_name_column: "CLASE DOCUMENTAL"            # (default: "CLASE DOCUMENTAL")
  metadata_list_column: "METADATOS"                # (default: "METADATOS")
  cmis_type_column: "CMISType"                     # (default: "CMISType")

  # --- column names: MapeoRVI_CM.csv (split AND manifest modes) ---
  rvi_cm_id_rvi_column: "IDRVI"                    # (default: "IDRVI")
  rvi_cm_id_cm_column: "IDCM"                      # (default: "IDCM")
  # 145: system id of the RVI code. Manifest mode ONLY — optional; a missing
  # column means every row falls to the wildcard system ("").
  rvi_cm_id_sistema_column: "IDSistema"            # (default: "IDSistema")

  # --- column names: split-mode-ONLY MapeoRVI_CM.csv extras (DEPRECATED) ---
  rvi_cm_clase_id_column: "IDClaseDocumental"      # (default: "IDClaseDocumental")
  rvi_cm_cmis_type_column: "CMISType"              # (default: "CMISType")
  rvi_cm_cmis_folder_column: "CMISFolder"          # (default: "CMISFolder")

  # --- column names: split-mode MetadatosCM.csv (DEPRECATED — manifest mode
  # gets all of this from the JSON manifest instead) ---
  metadatos_id_corto_column: "IDCorto"             # (default: "IDCorto")
  metadatos_metadata_column: "Metadato"            # (default: "Metadato")
  metadatos_required_column: "Requerido"           # (default: "Requerido")
  metadatos_cmis_property_id_column: "CMISPropertyId"  # (default: "CMISPropertyId")

  # --- value that marks a metadata field as required in MetadatosCM (split mode) ---
  required_marker: "Yes"                           # (default: "Yes")


# -----------------------------------------------------------------------------
# metadata  (REQUIRED)  — S3: how each CM property value is resolved.
# -----------------------------------------------------------------------------
metadata:
  # field_aliases — logical field name → CM property alias.
  field_aliases:                           # (default: {} empty)
    CIF: BAC_CIF
    Nombre_Cliente: BAC_Nombre_Cliente
    Short_Name: BAC_Short_Name

  # field_sources  (REQUIRED) — per CM property, an ordered list of where to
  # pull its value from. First source that yields a value wins; if none do,
  # `default_value` is used (or the doc fails if there is no default).
  field_sources:
    BAC_CIF:
      sources:                             # (REQUIRED) min 1 item
        # source_type must be one of:
        #   "trigger"      — a column on the trigger record
        #   "rvabrep"      — a column on the RVABREP row
        #   "csv:<alias>"  — a named CSV source declared under `sources:`
        #   "as400:<alias>"— a named AS400 source declared under `sources:`
        #   "mssql:<alias>"— a named SQL Server source declared under `sources:` (130)
        - source_type: trigger
          lookup_value_column: cif         # (REQUIRED) column to read the value from
        - source_type: rvabrep
          lookup_value_column: index2
      default_value: "000000"              # (default: null) used if no source matches
    # lookup_value_source (084 + 147) — for `csv:` / `as400:` / `mssql:` sources
    # ONLY, WHERE the lookup key comes from. Syntax "<scope>.<attr>" with scope
    # `trigger` (cif, shortname, system_id), `rvabrep` (txn_num, index1..7, …)
    # or `field` (147 — see BAC_Shortname / BAC_CIF further down).
    # Ignored by the `trigger` / `rvabrep` source types (they read directly).
    BAC_Numero_Cuenta:
      sources:
        - source_type: "csv:clients"
          lookup_value_column: Numero_Cuenta
          lookup_key_column: TXN
          lookup_value_source: "rvabrep.txn_num"  # (default: "trigger.cif")
    BAC_Nombre_Cliente:
      sources:
        - source_type: "csv:clients"
          lookup_value_column: Nombre_Cliente   # column whose value is returned
          lookup_key_column: CIF                # (default: null) join key column
          validation:                           # (default: null) optional value check
            allowed_pattern: "^[A-Za-z0-9 ]+$"  # (default: null) regex the value must match
      default_value: "UNKNOWN_CLIENT"
    # format (146) — declarative normalisation of the VALUE. Same model, two
    # placements, two different moments:
    #   (a) per source — runs BETWEEN the fetch and `validation`, so the
    #       pattern can be strict without losing otherwise-good values;
    #   (b) per field  — runs on the WINNING value and on `default_value`,
    #       right before it goes to CM. Whichever source wins, CM gets the
    #       same shape.
    # Both are optional and independent. Absent ⇒ pre-146 behaviour.
    # Keys ALWAYS apply in this fixed order (not configurable):
    #   1 trim → 2 case → 3 strip_leading_zeros → 4 pad_left → 5 pad_right
    #   → 6 truncate
    # Edge rules: `strip_leading_zeros` never returns "" ("00000" → "0");
    # `pad_*` never cuts (a longer value comes back untouched — use
    # `truncate` for that); a value that ends up "" after formatting means
    # "this source gave nothing" and the chain moves on to the next source.
    # `truncate` smaller than a `pad_*.width` fails at LOAD time.
    BAC_Num_Cuenta:
      sources:
        - source_type: rvabrep
          lookup_value_column: index2
          format:                               # (a) PER SOURCE (default: null)
            trim: true                          # (default: false) value.strip()
            case: null                          # (default: null) "upper" | "lower"
            strip_leading_zeros: true           # (default: false) "000001000" → "1000"
            pad_left:                           # (default: null)
              width: 9                          # (REQUIRED) > 0
              char: "0"                         # (default: "0") exactly 1 char
            # pad_right:                        # (default: null)
            #   width: 20                       # (REQUIRED) > 0
            #   char: " "                       # (default: " ") exactly 1 char
            # truncate: 9                       # (default: null) first N chars, > 0
          validation:
            allowed_pattern: '^\d{9}$'          # strict: the format already normalised it
      default_value: "0"
      format:                                   # (b) PER FIELD (default: null)
        pad_left:                               # the default is formatted, THEN validated:
          width: 9                              # "0" → "000000000" passes ^\d{9}$
          char: "0"
    BAC_Short_Name:
      sources:
        - source_type: "as400:branch_lookup"
          lookup_value_column: BRANCH_NAME
          lookup_key_column: BRANCH_ID
    # lookup_value_source: "field.<CANONICAL_NAME>" (147) — the lookup key is
    # the ALREADY-RESOLVED value of ANOTHER field. This is what lets you chain
    # hops: child affiliate → parent → shortname → CIF → name. The resolver
    # builds the dependency graph, sorts it topologically and resolves in that
    # order, so the DECLARATION ORDER BELOW DOES NOT MATTER. Cycles and
    # references to fields that do not exist fail at LOAD time, with the full
    # cycle in the message — never mid-batch. A dependency that did not resolve
    # skips ONLY that source; the chain moves on to the next one.
    BAC_Afiliado_Hijo:
      sources:
        - source_type: rvabrep
          lookup_value_column: index1
    BAC_Afiliado_Padre:
      sources:
        - source_type: "as400:afiliados"
          lookup_value_source: "field.BAC_Afiliado_Hijo"   # hop 1
          lookup_key_column: AFIHIJ
          lookup_value_column: AFIPAD
    BAC_Shortname:
      sources:
        - source_type: trigger              # if RVABREP already brought it, free
          lookup_value_column: shortname
        - source_type: "as400:clientes"     # otherwise, hop 2
          lookup_value_source: "field.BAC_Afiliado_Padre"
          lookup_key_column: CUSAFI
          lookup_value_column: CUSSHN
    # In a real config this last hop would be one more source appended to the
    # `BAC_CIF` chain above; it is a separate field here only so that both
    # examples can live in the same file.
    BAC_CIF_Chained:
      sources:
        - source_type: "as400:clientes"     # hop 3
          lookup_value_source: "field.BAC_Shortname"
          lookup_key_column: CUSSHN
          lookup_value_column: CUSCIF
    BAC_Sistema:
      sources:
        - source_type: trigger
          lookup_value_column: system_id

  # sources — named lookup sources referenced by `csv:<alias>` / `as400:<alias>`
  # / `mssql:<alias>` above. A list; it MAY mix csv, as400 and mssql entries freely.
  sources:                                 # (default: [] empty)
    - kind: csv                            # (default: "csv" — may be omitted)
      alias: clients                       # (REQUIRED) the name used in `csv:clients`
      csv_path: /path/to/clients.csv        # (REQUIRED) must exist
    - kind: as400                          # (REQUIRED for an AS400 source)
      alias: branch_lookup                 # (REQUIRED) the name used in `as400:branch_lookup`
      as400_connection:                    # (REQUIRED) inline object OR alias, e.g. `rvi`
        host: as400.bank.example
        port: 446
        database: RVILIB
        driver: "iSeries Access ODBC Driver"
        table: null
      # provide EXACTLY ONE of `table` / `query`:
      table: BRANCHES                      # bare-table prefetch  (XOR query)
      # query: "SELECT * FROM RVILIB.BRANCHES WHERE ACTIVE = 'Y'"   # (XOR table)
    - kind: mssql                          # (130) SQL Server lookup source
      alias: clientes                      # (REQUIRED) the name used in `mssql:clientes`
      connection: clientes_sql             # (REQUIRED) alias under `connections:` with kind mssql
                                           # — no inline form; credentials come from
                                           # CLIENTES_SQL_USERNAME / CLIENTES_SQL_PASSWORD
      table: dbo.clientes                  # EXACTLY ONE of `table` / `query`
      # query: "SELECT CIF, Nombre_Cliente FROM dbo.clientes WHERE Activo = 1"

  # prefetch_enabled — bulk-load metadata sources once at startup vs. per-doc.
  prefetch_enabled: true                   # (default: true)

  # cache — cross-batch metadata cache (POST-MVP §9, shipped in 037).
  cache:
    enabled: false                         # (default: false)
    ttl_minutes: 60                        # (default: 60)  range 1..43200 (30 days)


# -----------------------------------------------------------------------------
# identity  (optional, 147)  — WHO the client of this document is.
#
# Resolved at the HEAD of S2, with the same field_sources engine as the
# metadata, so a slot can arrive after three chained hops. It is the SINGLE
# SOURCE for the three writes that used to be able to disagree:
#   * the `migration_log` row (SQLite),
#   * CTECIF / CTENUM in the AS400 log (RVIMGLOG / NIARVILOG),
#   * the (system, IDRVI) mapping key of S2.
#
# ALL THREE SLOTS ARE OPTIONAL. An absent slot ⇒ pre-147 behaviour: the value
# is read from the trigger, with no chain, and the mapping key keeps coming
# from `trigger_system_id(trigger)`.
#
# Validators (they fail at LOAD time): `field` must be a key of
# `metadata.field_sources`, and `max_digits` is only valid on `cif`.
# -----------------------------------------------------------------------------
identity:                                  # (default: every slot null)
  shortname:                               # (default: null) feeds CTECIF
    field: BAC_Shortname                   # (REQUIRED) key of metadata.field_sources
    on_missing: fail                       # (default: "fail") fail | warn | default
  cif:                                     # (default: null) feeds CTENUM
    field: BAC_CIF
    on_missing: fail
    # max_digits (cif ONLY) — the REAL precision of the CTENUM column. It
    # compares the LENGTH; it never converts anything. This is what replaces
    # `int(cif) if cif.isdigit() else 0`, which validated the TYPE and never
    # the MAGNITUDE: a longer CIF blew up with 22003 on the bank's side, and a
    # non-numeric one silently became customer `0`. When there is no valid
    # number left for CTENUM, NULL goes to the wire — never an invented 0.
    max_digits: 9                          # (default: null) > 0
    default_value: null                    # (default: null) REQUIRED if on_missing: default
  system_id:                               # (default: null) feeds the mapping key
    field: BAC_Sistema
    on_missing: warn                       # `warn` logs the full chain and leaves ""


# -----------------------------------------------------------------------------
# assembly  (REQUIRED)  — S4: turning RVABREP page files into a single doc.
# -----------------------------------------------------------------------------
assembly:
  source_root: /path/to/source-files       # (REQUIRED) root dir of the page files; must exist
  temp_dir: /path/to/staging-tmp           # (REQUIRED) scratch dir; CREATED at run time
  # image_type_map — RVABREP image_type code → MIME type.
  image_type_map:                          # (default: the three entries below)
    B: image/tiff                          # (default)
    O: application/pdf                     # (default)
    C: image/jpeg                          # (default)
  # keep_staged_files — preserve the assembled PDF under temp_dir after a
  # successful S5_DONE (085). Default false → the orchestrator deletes
  # temp_dir/{txn}.pdf post-upload. true keeps it for debug/inspection.
  keep_staged_files: false                 # (default: false)

  # synthetic_content (102) — STRESS TESTING ONLY. When enabled, S4 skips
  # the real page files under `source_root` and builds a valid one-page PDF
  # in memory, sized from a weighted band draw. Lets a multi-TB stress run
  # happen without materialising multi-TB on disk. The same `txn_num`
  # always yields the same PDF (deterministic given `seed`).
  # NEVER enable this against a real migration: the uploaded bytes are
  # synthetic, not the bank's documents.
  synthetic_content:
    enabled: false                         # (default: false → real files from source_root)
    seed: 0                                # (default: 0) PRNG seed; same seed = same corpus
    # size_mix — the weighted size bands. Empty (the default) uses the
    # built-in 60/30/10 distribution shown below verbatim. `min` / `max`
    # accept binary suffixes: b / kb / mb / gb (1 kb = 1024), case-insensitive;
    # a bare number is bytes. Weights are relative, not percentages —
    # they only have to be >= 0 and not all zero.
    size_mix: []                           # (default: [] → the 3 bands below)
      # - name: small                      # (REQUIRED) label of the band
      #   weight: 60.0                     # (REQUIRED) >= 0, relative weight
      #   min: 50kb                        # (REQUIRED) lower bound, inclusive
      #   max: 1mb                         # (REQUIRED) upper bound, inclusive
      # - name: medium
      #   weight: 30.0
      #   min: 1mb
      #   max: 10mb
      # - name: large
      #   weight: 10.0
      #   min: 10mb
      #   max: 40mb


# -----------------------------------------------------------------------------
# cmis  (REQUIRED)  — S5: the IBM Content Manager / Alfresco CMIS target.
# Credentials come from CMIS_USERNAME / CMIS_PASSWORD env vars.
# -----------------------------------------------------------------------------
cmis:
  base_url: "http://cm.bank.example:9080/opencmcmis/browser"  # (REQUIRED)
  repo_id: "myrepo"                        # (REQUIRED) repository id; "" for Alfresco browser binding
  timeout_seconds: 300.0                   # (default: 300.0)  > 0
  verify_ssl: false                        # (default: false)
  max_bandwidth_mbps: 0.0                  # (default: 0.0 = uncapped)  >= 0
  retry_max_attempts: 3                    # (default: 3)  >= 1
  retry_base_delay_s: 2.0                  # (default: 2.0)  >= 0  (exponential backoff base)
  workers: 4                               # (default: 4)  >= 1  (S5 upload pool size)
  http2: true                              # (default: true; 089) false → force HTTP/1.1.
  #                                        #   Useful when many parallel uploads share a
  #                                        #   server-side h2 flow-control window and
  #                                        #   serialize aggregate throughput.
  upload_chunk_bytes: 1048576              # (default: 1048576 = 1 MiB; 090)
  #                                        #   range 4096..67108864. Read chunk size of
  #                                        #   the multipart encoder; bigger = fewer GIL
  #                                        #   acquisitions under parallel uploads.

  # auto_tune — AIMD adaptive worker pool. When enabled, a
  # background controller grows/shrinks the worker count (and optionally the
  # request timeout) based on observed S5 p95 latency vs target.
  auto_tune:
    enabled: false                         # (default: false → static `workers` above)
    min_threads: 2                         # (default: 2)   >= 1
    max_threads: 50                        # (default: 50)  >= 1  (must be >= min_threads)
    target_p95_ms: 5000.0                  # (default: 5000.0)  > 0
    adjustment_interval_s: 30              # (default: 30)  >= 1
    warmup_seconds: 60                     # (default: 60)  >= 0  (no adjustments during warmup)
    # 061: don't act on a tick that has seen fewer than this many S5 samples.
    # Nearest-rank p95 with few samples is dominated by a single outlier
    # (typical case: the first cold-connection upload of a chunk). 20 is the
    # empirical floor where one 30-second outlier among 19 normal 1.5-second
    # samples cannot dominate the p95.
    min_samples: 20                        # (default: 20)  >= 1
    timeout_auto_adjust: true              # (default: true)  also tune the CMIS timeout
    min_timeout_s: 30                      # (default: 30)  >= 1
    max_timeout_s: 600                     # (default: 600) >= 1  (must be >= min_timeout_s)
    # 068: shape of the AIMD growth / halve response.
    growth_factor: 1.25                    # (default: 1.25)  range 1.0..4.0  (multiplicative grow)
    halve_factor: 0.75                     # (default: 0.75)  range 0.05..1.0 (shrink multiplier)
    halve_threshold_ratio: 1.5             # (default: 1.5)   range 1.05..10  (× target_p95 to halve)


# -----------------------------------------------------------------------------
# tracking  (REQUIRED)  — S6: idempotency + resume state.
# -----------------------------------------------------------------------------
tracking:
  db_path: /path/to/tracking.db            # (REQUIRED) SQLite file; CREATED at run time

  # as400_sync — distributed idempotency via the AS400 NIARVILOG table
  # (POST-MVP §4, shipped in 034). Default off → SQLite-only, pre-034 behavior.
  # When `enabled: true`, `connection` becomes REQUIRED.
  as400_sync:
    enabled: false                         # (default: false)
    connection:                            # (default: null; REQUIRED when enabled) object OR alias
      host: as400.bank.example
      port: 446
      database: RVILIB
      driver: "iSeries Access ODBC Driver"
      table: null
    library: RVILIB                        # (default: "RVILIB")  DB2 schema; validated identifier
    table: NIARVILOG                       # (default: "NIARVILOG") validated identifier
    # columns — per-environment physical column names for NIARVILOG (049).
    # Omit entirely → canonical names. Every value is validated as a DB2
    # identifier (letter/@/#/$ then letters/digits/_/@/#/$, 128 max).
    columns:                               # (default: all canonical names below)
      system_id_column: SISCOD             # (default: "SISCOD")
      txn_num_column: TRNNUM               # (default: "TRNNUM")
      doc_format_column: DOCFRM            # (default: "DOCFRM")
      image_archive_column: IMGARC         # (default: "IMGARC")
      image_type_column: IMGTIP            # (default: "IMGTIP")
      client_cif_column: CTECIF            # (default: "CTECIF")
      client_num_column: CTENUM            # (default: "CTENUM")
      status_column: STSCOD                # (default: "STSCOD")
      idcm_column: IDNBAC                  # (default: "IDNBAC")
      cm_type_column: TIPIDN               # (default: "TIPIDN")
      cm_object_id_column: OBJIDN          # (default: "OBJIDN")
      retry_count_column: NUMREI           # (default: "NUMREI")
      started_at_column: PMRREI            # (default: "PMRREI")
      finished_at_column: FINREI           # (default: "FINREI")
      error_message_column: EERRMSG        # (default: "EERRMSG")
    stale_in_progress_minutes: 30          # (default: 30)  range 1..1440
    retry_attempts: 3                      # (default: 3)   range 1..10
    retry_base_delay_s: 5.0                # (default: 5.0) > 0
    # mode (096) — how S5 syncs with AS400:
    #   "claim"    (default): atomic per-document claim in S5 — prevents
    #              double-upload against a competing migrator, at the cost
    #              of 2-3 synchronous DB2 round-trips per doc.
    #   "periodic": S5 writes SQLite only; a background reconciler pushes
    #              to AS400 every `periodic.interval_minutes`. Does NOT
    #              prevent double-upload (conflicts detected post-hoc).
    mode: claim                            # (default: "claim")  one of: claim | periodic
    # periodic — REQUIRED when mode == "periodic"; ignored otherwise.
    periodic:                              # (default: null)
      interval_minutes: 5                  # (default: 5)  range 1..1440


# -----------------------------------------------------------------------------
# observability  (optional — has a full default)  — the spec logging.
# -----------------------------------------------------------------------------
observability:
  enabled: true                            # (default: true)  master toggle
  pipeline_metrics: true                   # (default: true)  tier 2
  network_metrics: true                    # (default: true)  tier 3
  # system_metrics — tier 5, psutil sampling (POST-MVP §2, shipped in 026).
  # Accepts the structured form below OR the legacy bool `system_metrics: false`.
  system_metrics:
    enabled: true                          # (default: true)
    sample_interval_s: 5.0                 # (default: 5.0)  range 1.0..60.0
  log_dir: ./logs                          # (default: "./logs")  CREATED at run time
  log_format: json                         # (default: "json")  one of: json | text
  rotation_mb: 100                         # (default: 100)  >= 1
  retention_days: 30                       # (default: 30)   >= 1
  slow_op_threshold_ms: 5000               # (default: 5000) >= 0  (tier 4 slow-ops report)
  slow_op_top_n: 20                        # (default: 20)   >= 1
  # unmask_pii — emit RAW property values in the S5 upload trace instead of
  # masked ones. NEVER set true in production. No CLI flag exists for this;
  # `doctor` emits a WARNING at startup when it is set.
  unmask_pii: false                        # (default: false)


# -----------------------------------------------------------------------------
# processing  (optional — has a full default)  — multi-batch + dual-lane knobs.
# -----------------------------------------------------------------------------
processing:
  # mode (063) — which orchestrator runs the pipeline:
  #   "batched"   (default): historical multi-batch pipeline; while batch N
  #               uploads (S5), batch N+1 prepares (S0–S4). Honors
  #               `batches_in_flight` and full resume semantics.
  #   "streaming": continuous producer-consumer pipeline bounded by a queue
  #               (`streaming.bucket_size`). `batches_in_flight` is IGNORED;
  #               resume args (--from-stage, --batch-id) are rejected.
  mode: batched                            # (default: "batched")  one of: batched | streaming

  # streaming — knobs for `mode: streaming`. `bucket_size` is the max number
  # of fully-prepared docs sitting between PREP (S1–S4) and UPLOAD (S5).
  # Peak memory scales with bucket_size, independent of total trigger count.
  streaming:
    bucket_size: 100                       # (default: 100)  >= 1

  # batches_in_flight — producer-consumer overlap: while batch N uploads (S5),
  # batch N+1 prepares (S0–S4). CAPPED AT 2 — values > 2 (POST-MVP §7) are a
  # deferred change and rejected by the schema. Ignored in `mode: streaming`.
  batches_in_flight: 2                     # (default: 2)  range 1..2

  # prep_workers — thread count for the prep stages S2 (mapping), S3
  # (metadata) and S4 (assembly), which otherwise run one document at a
  # time. Default 1 = serial, byte-identical to pre-056. S0/S1 stay
  # serial by design (they carry the cross-batch idempotency + resume
  # logic). I/O-bound work, so threads scale; the real ceiling is the
  # storage backing `assembly.source_root` (local disk vs network share).
  prep_workers: 1                          # (default: 1)  >= 1

  # heavy_light_lanes — adaptive heavy/light upload lanes (POST-MVP §1,
  # shipped in 036). Default off → single-pool S5, pre-036 behavior.
  heavy_light_lanes:
    enabled: false                         # (default: false)
    heavy_threshold_bytes: 10485760        # (default: 10485760 = 10 MiB)  > 0
    heavy_lane_min_batch: 50               # (default: 50)  >= 1  (smaller batches skip the split)
    heavy_initial_ratio: 0.2               # (default: 0.2)  range 0.0..1.0  (heavy lane's worker share)
    rebalance_interval_s: 10.0             # (default: 10.0)  range >0..600
    idle_threshold_s: 15.0                 # (default: 15.0)  range >0..3600

  # s4_use_processes (066) — run S4 (PDF assembly) in a ProcessPoolExecutor
  # for real CPU-bound parallelism (img2pdf/PIL are GIL-bound under threads).
  # Default true. false → S4 runs inline in the producer thread (pre-066).
  s4_use_processes: true                   # (default: true)
  # s4_max_processes — pool size. null → os.cpu_count(); an int overrides it.
  s4_max_processes: null                   # (default: null)  >= 1 when set
  # s4_smart_routing (094) — when true AND the process pool is active,
  # native PDFs run inline (shutil.copy2 releases the GIL during I/O) while
  # paginated TIFF/JPEG go to the pool (img2pdf is CPU-bound). Avoids the
  # pickle/IPC/spawn overhead of the pool for non-CPU-bound docs — matters
  # most on Windows where `spawn` is expensive. 114 flipped the default to
  # true; `false` restores the 094-off behaviour (everything to the pool).
  s4_smart_routing: true                   # (default: true, 114)


# -----------------------------------------------------------------------------
# environment  (optional)  — 123: which environment this config points at.
# The headless commands IGNORE it entirely; it only drives the operations
# console (`cmcourier console`):
#   * "staging" (default) — green STAGING badge, plain launch confirmation.
#   * "prd"               — permanent red ⚠ PRODUCCIÓN badge, and the launch
#                           interlock in [5] CORRER requires typing `PRD`
#                           before the run starts. `sync recover --apply`
#                           from [8] asks for the same typed confirmation.
# -----------------------------------------------------------------------------
environment: staging                       # (default: "staging")  one of: staging | prd


# -----------------------------------------------------------------------------
# batch_size  (optional)  — TOP-LEVEL batch size: how many triggers go into
# one migration batch. DISTINCT from `indexing.batch_size` (which is the
# RVABREP fetch chunk size). Default differs on purpose.
#
# MEMORY CONTRACT (050): triggers stream in `batch_size`-sized chunks —
# they are NOT all loaded at once. Peak in-flight memory is roughly
# `batch_size × processing.batches_in_flight` documents, independent of
# the total trigger count. This is what lets the ~20M-row production
# RVABREP migration run without OOM. The 20M run uses
# `indexing.source.kind: as400` (the live AS400 table, streamed per
# lookup) — the CSV source is in-memory by design and stays a
# testing / small-bank tool.
# -----------------------------------------------------------------------------
batch_size: 1000                           # (default: 1000)  >= 1
